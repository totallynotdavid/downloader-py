[project]
name = "media-url-extractor"
version = "1.0.0"
description = "HTTP API that returns direct media URLs from social media posts"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "David Duran", email = "dadch1404@gmail.com" }]
dependencies = [
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "instagrapi>=3.0.25",
    "requests>=2.34.2",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
media-url-extractor = "media_url_extractor.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
# instagrapi pins pydantic==2.12.5 on Android only. Without this, the lock must
# satisfy that pin on every platform.
environments = ["sys_platform != 'android'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=media_url_extractor --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "instagrapi", "instagrapi.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.17.1",
    "types-requests>=2.33.0.20261006",
]
